apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
  namespace: aimemory
  labels:
    app: retrieval-service
    tier: core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: retrieval-service
  template:
    metadata:
      labels:
        app: retrieval-service
        tier: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: retrieval-service
          image: aimemory/retrieval-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: SERVER_PORT
              value: "8083"
          envFrom:
            - configMapRef:
                name: aimemory-config
            - configMapRef:
                name: aimemory-service-configs
            - secretRef:
                name: aimemory-secrets
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-service
  namespace: aimemory
spec:
  selector:
    app: retrieval-service
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  type: ClusterIP