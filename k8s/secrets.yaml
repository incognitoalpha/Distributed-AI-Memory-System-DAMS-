apiVersion: v1
kind: Secret
metadata:
  name: aimemory-secrets
  namespace: aimemory
type: Opaque
stringData:
  # JWT
  JWT_SECRET: "your-jwt-secret-min-256-bits-long-here"
  JWT_EXPIRATION_MS: "86400000"

  # Database
  DB_USERNAME: "aimemory"
  DB_PASSWORD: "changeme"

  # Redis
  REDIS_PASSWORD: "changeme"

  # OpenAI
  OPENAI_API_KEY: "sk-your-openai-key"

  # Kafka
  KAFKA_USERNAME: "aimemory"
  KAFKA_PASSWORD: "changeme"