apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  namespace: aimemory
  labels:
    app: memory-service
    tier: core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: memory-service
  template:
    metadata:
      labels:
        app: memory-service
        tier: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: memory-service
          image: aimemory/memory-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: SERVER_PORT
              value: "8082"
          envFrom:
            - configMapRef:
                name: aimemory-config
            - configMapRef:
                name: aimemory-service-configs
            - secretRef:
                name: aimemory-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: memory-service
  namespace: aimemory
spec:
  selector:
    app: memory-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  type: ClusterIP