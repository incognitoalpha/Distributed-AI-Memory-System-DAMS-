apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking-engine
  namespace: aimemory
  labels:
    app: ranking-engine
    tier: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ranking-engine
  template:
    metadata:
      labels:
        app: ranking-engine
        tier: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8087"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: ranking-engine
          image: aimemory/ranking-engine:latest
          ports:
            - containerPort: 8087
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: SERVER_PORT
              value: "8087"
          envFrom:
            - configMapRef:
                name: aimemory-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ranking-engine
  namespace: aimemory
spec:
  selector:
    app: ranking-engine
  ports:
    - port: 8087
      targetPort: 8087
      name: http
  type: ClusterIP