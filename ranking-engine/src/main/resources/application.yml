server:
  port: 8087

spring:
  application:
    name: ranking-engine

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aimemory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      group-id: ranking-engine

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Ranking configuration
ranking:
  decay:
    half-life-days: 30
  frequency:
    cap: 20
  weights:
    recency: 0.40
    frequency: 0.35
    salience: 0.25

logging:
  level:
    com.aimemory: DEBUG